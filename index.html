<!doctype html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#7d1d0d">
<title>Maa Madurai Kitchen Log</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Poppins:wght@400;500;600;700&family=Noto+Sans+Tamil:wght@400;500&display=swap">
<style>
/* Layout: brand bar + date strip on top, one task per tab (veg check / food balance / history), rows sized for wet thumbs on a kitchen tablet. */
:root {
  --bg: #f7f0e4; --surface: #fffaf2; --sunk: #f1e6d4; --ink: #2b130c; --muted: #6e584c; --line: #e3d3bc;
  --brand: #7d1d0d; --brand-ink: #face0b; --accent: #8f2410; --accent-ink: #fffaf2;
  --ok: #2c7a47; --ok-bg: #e3f1e6; --warn: #9a6200; --warn-bg: #fbecc8; --bad: #b42318; --bad-bg: #fbe0dc;
  --focus: #c98a00;
  --f-display: 'Cinzel', Georgia, 'Times New Roman', serif;
  --f-body: 'Poppins', -apple-system, 'Segoe UI', sans-serif;
  --f-tamil: 'Noto Sans Tamil', 'Poppins', sans-serif;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #1b0c08; --surface: #27130d; --sunk: #200f0a; --ink: #f5ede2; --muted: #c4b0a0; --line: #48291e;
  --brand: #5c150a; --brand-ink: #face0b; --accent: #face0b; --accent-ink: #2b130c;
  --ok: #7ed39a; --ok-bg: #173323; --warn: #f2c25a; --warn-bg: #3a2a0c; --bad: #ff9a8a; --bad-bg: #44160f;
  --focus: #face0b; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #1b0c08; --surface: #27130d; --sunk: #200f0a; --ink: #f5ede2; --muted: #c4b0a0; --line: #48291e;
  --brand: #5c150a; --brand-ink: #face0b; --accent: #face0b; --accent-ink: #2b130c;
  --ok: #7ed39a; --ok-bg: #173323; --warn: #f2c25a; --warn-bg: #3a2a0c; --bad: #ff9a8a; --bad-bg: #44160f;
  --focus: #face0b; color-scheme: dark }

* { box-sizing: border-box }
body { background: var(--bg); color: var(--ink); font: 15px/1.5 var(--f-body); }
.wrap { max-width: 920px; margin: 0 auto; padding-inline: 16px; padding-block: 0 48px; }
header.bar { background: var(--brand); color: var(--brand-ink); padding: calc(env(safe-area-inset-top, 0px) + 14px) 16px 14px; }
header.bar .in { max-width: 920px; margin: 0 auto; display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: baseline; justify-content: space-between }
header.bar h1 { font: 700 1.35rem/1.2 var(--f-display); letter-spacing: .04em; margin: 0 }
header.bar .sub { color: #f5ede2; opacity: .85; font-size: .85rem }
[lang="ta"] { font-family: var(--f-tamil) }

.datebar { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; padding-block: 14px }
.datebar input[type=date] { font: 600 1rem var(--f-body); padding: 8px 10px; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); color: var(--ink) }
.btn { font: 600 .95rem var(--f-body); border: 1px solid var(--line); background: var(--surface); color: var(--ink); border-radius: 10px; padding: 9px 14px; cursor: pointer; min-height: 44px }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent) }
.btn:disabled { opacity: .5; cursor: not-allowed }
:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px }

nav.tabs { display: flex; gap: 4px; border-bottom: 2px solid var(--line); margin-bottom: 16px; overflow-x: auto }
nav.tabs button { font: 600 .95rem var(--f-body); background: none; border: 0; color: var(--muted); padding: 10px 14px; border-bottom: 3px solid transparent; margin-bottom: -2px; cursor: pointer; white-space: nowrap; min-height: 44px }
nav.tabs button[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--accent) }

.notice { background: var(--sunk); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; margin-bottom: 14px; color: var(--muted) }
.notice.warn { background: var(--warn-bg); color: var(--warn); border-color: transparent }
.notice b { color: var(--ink) }

.summary { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 10px; margin-bottom: 14px }
.summary > div { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; min-width: 0 }
.summary .k { font-size: .72rem; text-transform: uppercase; letter-spacing: .08em; color: var(--muted) }
.summary .v { font-weight: 700; font-size: 1.05rem; font-variant-numeric: tabular-nums }
.summary ul { margin: 4px 0 0; padding-left: 18px }

.list { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; overflow: hidden }
.row { display: grid; grid-template-columns: minmax(130px, 1.3fr) auto auto minmax(120px, auto); gap: 10px 14px; align-items: center; padding: 12px 14px; border-top: 1px solid var(--line) }
.row:first-child { border-top: 0 }
.row.bal { grid-template-columns: minmax(130px, 1.3fr) auto auto auto }
.nm { min-width: 0 }
.nm b { display: block; font-weight: 600 }
.nm span { color: var(--muted); font-size: .85rem }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; background: var(--sunk) }
.seg button { font: 500 .85rem var(--f-body); border: 0; background: none; color: var(--muted); padding: 8px 11px; min-height: 40px; cursor: pointer; border-left: 1px solid var(--line) }
.seg button:first-child { border-left: 0 }
.seg button[aria-pressed="true"][data-v="enough"], .seg button[aria-pressed="true"][data-v="good"], .seg button[aria-pressed="true"][data-v="chill"] { background: var(--ok-bg); color: var(--ok); font-weight: 700 }
.seg button[aria-pressed="true"][data-v="low"], .seg button[aria-pressed="true"][data-v="staff"] { background: var(--warn-bg); color: var(--warn); font-weight: 700 }
.seg button[aria-pressed="true"][data-v="out"], .seg button[aria-pressed="true"][data-v="poor"], .seg button[aria-pressed="true"][data-v="discard"] { background: var(--bad-bg); color: var(--bad); font-weight: 700 }
.qty { display: inline-flex; align-items: center; gap: 6px; color: var(--muted); font-size: .85rem; white-space: nowrap }
.qty input { width: 76px; font: 600 1rem var(--f-body); font-variant-numeric: tabular-nums; padding: 7px 8px; border: 1px solid var(--line); border-radius: 8px; background: var(--bg); color: var(--ink); text-align: right }

.foot { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin-top: 14px }
.foot label { display: flex; flex-direction: column; gap: 4px; font-size: .8rem; color: var(--muted); flex: 1 1 200px; min-width: 0 }
.foot input, .foot textarea { font: 500 1rem var(--f-body); padding: 9px 10px; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); color: var(--ink); width: 100% }
.foot textarea { min-height: 44px; resize: vertical }
.saved { font-size: .85rem; color: var(--muted) }
.saved.ok { color: var(--ok) }
.saved.err { color: var(--bad) }

.hist { overflow-x: auto; background: var(--surface); border: 1px solid var(--line); border-radius: 14px }
table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; min-width: 560px }
th, td { text-align: left; padding: 10px 12px; border-top: 1px solid var(--line); font-size: .9rem; vertical-align: top }
th { border-top: 0; font-size: .72rem; text-transform: uppercase; letter-spacing: .08em; color: var(--muted) }
td a { color: var(--ink); font-weight: 600 }
.pill { display: inline-block; padding: 1px 8px; border-radius: 999px; font-size: .78rem; font-weight: 600 }
.pill.ok { background: var(--ok-bg); color: var(--ok) } .pill.warn { background: var(--warn-bg); color: var(--warn) } .pill.bad { background: var(--bad-bg); color: var(--bad) }
.muted { color: var(--muted) }
.empty { padding: 28px 16px; text-align: center; color: var(--muted) }
.editor textarea { width: 100%; min-height: 220px; font: 500 .9rem/1.6 ui-monospace, Menlo, Consolas, monospace; padding: 10px; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); color: var(--ink) }
.editor h3 { margin: 18px 0 6px; font-size: 1rem }
.editor p { margin: 0 0 8px; color: var(--muted); font-size: .85rem; max-width: 65ch }

@media (max-width: 680px) {
  .row, .row.bal { grid-template-columns: 1fr 1fr; }
  .row .nm { grid-column: 1 / -1 }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important } }
</style>
<style>
html { -webkit-text-size-adjust: 100% }
[hidden] { display: none !important }
body { margin: 0 }
.pinbox { max-width: 360px; margin: 48px auto; background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 24px; display: flex; flex-direction: column; gap: 12px }
.pinbox h2 { font: 700 1.2rem var(--f-display); margin: 0 }
.pinbox input { font: 600 1.4rem var(--f-body); letter-spacing: .3em; text-align: center; padding: 10px; border: 1px solid var(--line); border-radius: 10px; background: var(--bg); color: var(--ink) }

.step { font-size: .72rem; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); margin: 22px 0 8px }
.who { display: flex; flex-wrap: wrap; gap: 10px; align-items: end }
.who label { display: flex; flex-direction: column; gap: 4px; font-size: .8rem; color: var(--muted); flex: 1 1 220px; min-width: 0 }
.who input { font: 600 1.1rem var(--f-body); padding: 10px 12px; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); color: var(--ink); width: 100% }
.who input[type=date] { font-size: 1rem }

.cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 12px }
.card { text-align: left; font: inherit; color: var(--ink); background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 18px; cursor: pointer; display: flex; flex-direction: column; gap: 6px; min-height: 120px }
.card:hover:not(:disabled) { border-color: var(--accent) }
.card:disabled { opacity: .55; cursor: not-allowed }
.card b { font: 700 1.2rem var(--f-display); letter-spacing: .02em }
.card .st { font-size: .85rem; color: var(--muted) }
.card .st.done { color: var(--ok); font-weight: 600 }

.formhead { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; justify-content: space-between; margin: 18px 0 12px }
.formhead h2 { font: 700 1.3rem var(--f-display); margin: 0 }
.formhead .muted { font-size: .9rem }
.sec { margin: 18px 0 8px; font-weight: 700; font-size: .95rem; display: flex; gap: 8px; align-items: baseline }
.sec small { font-weight: 400; color: var(--muted) }
.item { display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center; justify-content: space-between; padding: 11px 14px; border-top: 1px solid var(--line) }
.item:first-child { border-top: 0 }
.item .nm { flex: 1 1 160px }
.item.filled { background: var(--sunk) }
.other { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; padding: 10px 14px; border-top: 1px solid var(--line) }
.other input { font: 500 1rem var(--f-body); padding: 7px 9px; border: 1px solid var(--line); border-radius: 8px; background: var(--bg); color: var(--ink) }
.other input.nmIn { flex: 1 1 160px; min-width: 0 }
.other input.kgIn { width: 84px; text-align: right; font-variant-numeric: tabular-nums }
.linkbtn { background: none; border: 0; color: var(--accent); font: 600 .9rem var(--f-body); cursor: pointer; padding: 10px 14px; min-height: 44px }
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(env(safe-area-inset-bottom, 0px) + 18px); background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 999px; font-weight: 600; box-shadow: 0 6px 24px rgba(0,0,0,.25); max-width: calc(100% - 32px) }
.pair { display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: center }
.seg button[aria-pressed="true"][data-v="Tray"], .seg button[aria-pressed="true"][data-v="Bucket"] { background: var(--accent); color: var(--accent-ink); font-weight: 700 }
.seg button[aria-pressed="true"][data-v="Enough"] { background: var(--ok-bg); color: var(--ok); font-weight: 700 }
.seg button[aria-pressed="true"][data-v="Low"] { background: var(--warn-bg); color: var(--warn); font-weight: 700 }
.seg button[aria-pressed="true"][data-v="Out"] { background: var(--bad-bg); color: var(--bad); font-weight: 700 }
@media (max-width: 680px) {
  .item .seg, .item .pair { display: flex; width: 100% }
  .item .pair .seg { flex: 1 1 160px; width: auto }
  .item .seg button { flex: 1 1 0; padding-inline: 4px }
}
</style>
</head>
<body>
<header class="bar"><div class="in">
  <h1>Maa Madurai Kitchen Log</h1>
  <span class="sub">Closing checks · Shop P34, Portico Plaza</span>
</div></header>

<div class="wrap">
  <form class="pinbox" id="pinForm" hidden>
    <h2>Staff PIN</h2>
    <p class="muted" style="margin:0">Type the shop PIN. This device remembers it.</p>
    <input id="pin" type="password" inputmode="numeric" autocomplete="off" aria-label="Staff PIN" required>
    <button class="btn primary" type="submit">Open the log</button>
    <span class="saved err" id="pinMsg"></span>
  </form>

  <div id="banner"></div>

  <!-- Start: name, then pick a check -->
  <section id="vStart" hidden>
    <div class="step">1 · Who is doing the check</div>
    <div class="who">
      <label for="who">Your name<input id="who" autocomplete="name" placeholder="Type your name"></label>
      <label for="date" style="flex: 0 1 180px">Closing of<input type="date" id="date"></label>
    </div>
    <div class="step">2 · Choose a check</div>
    <div class="cards" id="cards"></div>
    <div class="foot" style="margin-top:22px">
      <button class="btn" id="histBtn" type="button">History</button>
      <button class="btn" id="refresh" type="button">Refresh</button>
      <span class="saved" id="loadMsg"></span>
    </div>
  </section>

  <!-- One check -->
  <section id="vForm" hidden>
    <div class="formhead">
      <div><h2 id="fTitle"></h2><span class="muted" id="fSub"></span></div>
      <button class="btn" id="back" type="button">Back</button>
    </div>
    <div id="fBody"></div>
    <div class="foot">
      <label for="note">Notes (optional)<textarea id="note" placeholder="Anything the owner should know"></textarea></label>
    </div>
    <div class="foot">
      <button class="btn primary" id="save" type="button">Save</button>
      <span class="saved" id="saveMsg"></span>
    </div>
  </section>

  <!-- History -->
  <section id="vHist" hidden>
    <div class="formhead"><div><h2>History</h2><span class="muted">Last 31 days. Everything is also in the owner's Google Sheet.</span></div>
      <button class="btn" id="back2" type="button">Back</button></div>
    <div class="hist" id="histTable"></div>
  </section>

  <p class="muted" style="margin-top:32px;font-size:.8rem"><a href="#" id="forget" style="color:inherit">Forget the PIN on this device</a></p>
</div>
<div class="toast" id="toast" role="status" hidden></div>

<script src="config.js"></script>
<script>
(() => {
  const API = window.KITCHEN_LOG_API || '';
  const TZ = 'Australia/Sydney';
  const $ = (id) => document.getElementById(id);
  const esc = (s) => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const sydDate = (d = new Date()) => new Intl.DateTimeFormat('en-CA', { timeZone: TZ, year: 'numeric', month: '2-digit', day: '2-digit' }).format(d);
  const sydTime = (iso) => { const d = new Date(iso); return iso && !isNaN(d) ? new Intl.DateTimeFormat('en-AU', { timeZone: TZ, hour: 'numeric', minute: '2-digit' }).format(d) : '' };
  const nice = (ds) => new Date(ds + 'T12:00:00Z').toLocaleDateString('en-AU', { weekday: 'short', day: 'numeric', month: 'short', timeZone: 'UTC' });
  const store = { get(k) { try { return localStorage.getItem(k) } catch { return null } }, set(k, v) { try { localStorage.setItem(k, v) } catch {} }, del(k) { try { localStorage.removeItem(k) } catch {} } };
  const has = (v) => v !== null && v !== undefined && v !== '';

  const S = { pin: store.get('kl-pin') || '', data: null, date: sydDate(), check: null, draft: null, loading: false };
  const CHECKS = () => S.data?.checks || { veg: 'Vegetables', food: 'Food balance', pack: 'Packaging' };
  const saved = (date, check) => S.data?.days.find(d => d.date === date)?.checks?.[check] || null;

  // ---------- server ----------
  async function load() {
    if (!API) { banner('<b>Not set up yet.</b> The owner needs to add the Google Sheet link to config.js.'); return false }
    S.loading = true; $('loadMsg').textContent = 'Loading…';
    try {
      const data = await (await fetch(API + '?pin=' + encodeURIComponent(S.pin), { redirect: 'follow' })).json();
      if (!data.ok) {
        if (data.error === 'pin') { askPin('That PIN is not right.'); return false }
        if (data.error === 'pin_not_set') { askPin('The owner has not set a PIN yet (it is still 0000 in Apps Script).'); return false }
        throw new Error(data.error);
      }
      S.data = data; banner(''); $('loadMsg').textContent = '';
      renderCards(); if (!$('vHist').hidden) renderHist();
      return true;
    } catch (e) {
      banner('<b>Could not reach the log.</b> Check the Wi-Fi, then press Refresh. Anything you type is kept on this device until it saves.');
      $('loadMsg').textContent = ''; return false;
    } finally { S.loading = false }
  }
  async function post(body) {
    const res = await fetch(API, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ ...body, pin: S.pin }), redirect: 'follow' });
    return res.json();
  }
  const banner = (html) => $('banner').innerHTML = html ? `<div class="notice warn">${html}</div>` : '';
  function toast(msg) { const t = $('toast'); t.textContent = msg; t.hidden = false; clearTimeout(toast.t); toast.t = setTimeout(() => t.hidden = true, 3500) }

  // ---------- views ----------
  function show(v) { for (const id of ['vStart', 'vForm', 'vHist']) $(id).hidden = id !== v; window.scrollTo(0, 0) }

  function askPin(msg) {
    S.pin = ''; store.del('kl-pin');
    for (const id of ['vStart', 'vForm', 'vHist']) $(id).hidden = true;
    $('pinForm').hidden = false; $('pinMsg').textContent = msg || ''; $('pin').value = ''; $('pin').focus();
  }
  $('pinForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    S.pin = $('pin').value.trim(); $('pinMsg').textContent = 'Checking…';
    $('pinForm').hidden = true; show('vStart'); renderCards();
    if (await load()) store.set('kl-pin', S.pin);
  });
  $('forget').addEventListener('click', (e) => { e.preventDefault(); askPin('') });

  // ---------- start ----------
  $('who').value = store.get('kl-name') || '';
  $('who').addEventListener('input', () => { store.set('kl-name', $('who').value.trim()); renderCards() });
  $('date').value = S.date; $('date').max = sydDate(); $('date').min = sydDate(new Date(Date.now() - 30 * 864e5));
  $('date').addEventListener('change', (e) => { if (e.target.value) { S.date = e.target.value; renderCards() } });
  $('refresh').addEventListener('click', load);
  $('histBtn').addEventListener('click', () => { renderHist(); show('vHist') });
  $('back2').addEventListener('click', () => show('vStart'));

  function renderCards() {
    const named = !!$('who').value.trim();
    $('cards').innerHTML = Object.entries(CHECKS()).map(([k, label]) => {
      const c = saved(S.date, k);
      const draft = store.get(`kl-draft-${S.date}-${k}`);
      const st = c ? `<span class="st done">Saved ${sydTime(c.at)} by ${esc(c.by)}</span>` : draft ? '<span class="st">Started on this device, not saved</span>' : '<span class="st">Not done yet</span>';
      return `<button type="button" class="card" data-check="${k}" ${named && S.data ? '' : 'disabled'}><b>${esc(label)}</b>${st}</button>`;
    }).join('');
    if (!named) $('cards').insertAdjacentHTML('beforeend', '<p class="muted" style="margin:0">Type your name first.</p>');
    $('cards').querySelectorAll('.card').forEach(b => b.addEventListener('click', () => openCheck(b.dataset.check)));
  }

  // ---------- form ----------
  const draftKey = () => `kl-draft-${S.date}-${S.check}`;
  function openCheck(k) {
    S.check = k;
    const c = saved(S.date, k);
    let d = null; try { d = JSON.parse(store.get(draftKey()) || 'null') } catch {}
    S.draft = d || { items: structuredClone(c?.items || {}), other: structuredClone(c?.other || []), note: c?.note || '' };
    if (k === 'veg' && !S.draft.other.length) S.draft.other.push({ name: '', qty: null });
    $('fTitle').textContent = CHECKS()[k];
    $('fSub').textContent = `Closing ${S.date === sydDate() ? 'today' : nice(S.date)} · ${$('who').value.trim()}` + (c ? ` · last saved ${sydTime(c.at)} by ${c.by}` : '');
    $('note').value = S.draft.note || ''; $('saveMsg').textContent = '';
    renderForm(); show('vForm');
  }
  function keep() { store.set(draftKey(), JSON.stringify(S.draft)) }
  const fid = (s) => 'i-' + s.toLowerCase().replace(/[^a-z0-9]+/g, '-');

  function renderForm() {
    const secs = S.data.lists[S.check] || [], levels = S.data.levels;
    let html = secs.map(sec => `<div class="sec">${esc(sec.section)}${sec.items[0]?.input === 'tray' ? ' <small>tap Tray or Bucket, then how many</small>' : ''}</div><div class="list">` +
      sec.items.map(it => {
        const r = S.draft.items[it.key] || {};
        const num = `<label class="qty"><input type="number" inputmode="decimal" min="0" step="any" id="${fid(it.key)}" data-key="${esc(it.key)}" value="${r.qty ?? ''}" aria-label="${esc(it.name)} ${esc(it.unit)}"> ${esc(it.unit)}</label>`;
        const tog = it.input === 'qty' ? '' : `<div class="seg" role="group" aria-label="${esc(it.name)}">` + levels[it.input].map(v => `<button type="button" data-key="${esc(it.key)}" data-v="${v}" aria-pressed="${r.level === v}">${v}</button>`).join('') + '</div>';
        const ctl = it.input === 'qty' ? num : it.input === 'tray' ? `<div class="pair">${tog}${num}</div>` : tog;
        return `<div class="item ${has(r.qty) || r.level ? 'filled' : ''}"><div class="nm"><b>${esc(it.name)}</b>${it.ta ? `<span lang="ta">${esc(it.ta)}</span>` : ''}</div>${ctl}</div>`;
      }).join('') + '</div>').join('');
    if (S.check === 'veg') {
      html += '<div class="sec">Any other vegetable <small>not in the list, in kg</small></div><div class="list" id="others">' +
        S.draft.other.map((o, i) => `<div class="other"><input class="nmIn" id="on-${i}" data-i="${i}" data-f="name" placeholder="Vegetable name" value="${esc(o.name)}" aria-label="Other vegetable name">
          <input class="kgIn" id="oq-${i}" type="number" inputmode="decimal" min="0" step="any" data-i="${i}" data-f="qty" value="${o.qty ?? ''}" aria-label="Kilograms"> kg
          <button type="button" class="linkbtn" data-rm="${i}" aria-label="Remove">Remove</button></div>`).join('') +
        '<button type="button" class="linkbtn" id="addOther">+ Add another vegetable</button></div>';
    }
    if (!secs.length) html = '<div class="empty">This check has no items yet. The owner adds them in the Lists tab of the Google Sheet.</div>';
    $('fBody').innerHTML = html;
    $('addOther')?.addEventListener('click', () => { S.draft.other.push({ name: '', qty: null }); keep(); renderForm(); $('on-' + (S.draft.other.length - 1)).focus() });
  }

  $('fBody').addEventListener('click', (e) => {
    const b = e.target.closest('.seg button');
    if (b) {
      const r = S.draft.items[b.dataset.key] = { ...(S.draft.items[b.dataset.key] || {}) };
      r.level = r.level === b.dataset.v ? null : b.dataset.v;
      b.parentElement.querySelectorAll('button').forEach(x => x.setAttribute('aria-pressed', String(x.dataset.v === r.level)));
      b.closest('.item').classList.toggle('filled', !!r.level); keep(); return;
    }
    const rm = e.target.closest('[data-rm]');
    if (rm) { S.draft.other.splice(+rm.dataset.rm, 1); if (!S.draft.other.length) S.draft.other.push({ name: '', qty: null }); keep(); renderForm() }
  });
  $('fBody').addEventListener('input', (e) => {
    const i = e.target;
    if (i.dataset.key) {
      const r = S.draft.items[i.dataset.key] = { ...(S.draft.items[i.dataset.key] || {}) };
      r.qty = i.value === '' ? null : Math.max(0, +i.value);
      i.closest('.item').classList.toggle('filled', has(r.qty));
    } else if (i.dataset.i !== undefined) {
      const o = S.draft.other[+i.dataset.i];
      o[i.dataset.f] = i.dataset.f === 'qty' ? (i.value === '' ? null : Math.max(0, +i.value)) : i.value;
    }
    keep();
  });
  $('note').addEventListener('input', () => { S.draft.note = $('note').value; keep() });
  $('back').addEventListener('click', () => { renderCards(); show('vStart') });

  $('save').addEventListener('click', async () => {
    const msg = $('saveMsg'), by = $('who').value.trim();
    const items = Object.fromEntries(Object.entries(S.draft.items).filter(([, r]) => has(r?.qty) || r?.level));
    const other = S.draft.other.filter(o => o.name.trim() || has(o.qty));
    const half = other.find(o => !o.name.trim() || !has(o.qty));
    if (half) { msg.className = 'saved err'; msg.textContent = 'Give each other vegetable a name and kg, or remove it.'; return }
    if (!Object.keys(items).length && !other.length && !S.draft.note.trim()) { msg.className = 'saved err'; msg.textContent = 'Nothing entered yet.'; return }
    const btn = $('save'); btn.disabled = true; msg.className = 'saved'; msg.textContent = 'Saving…';
    try {
      const r = await post({ check: S.check, date: S.date, by, note: S.draft.note.trim(), items, other });
      if (!r.ok) {
        if (r.error === 'pin') return askPin('The PIN has changed. Type the new one, then save again.');
        throw new Error(r.error);
      }
      store.del(draftKey());
      toast(`${CHECKS()[S.check]} saved at ${sydTime(r.at)}`);
      await load(); show('vStart');
    } catch (e) {
      msg.className = 'saved err'; msg.textContent = 'Not saved. Check the Wi-Fi and press Save again. Your entries are kept on this device.';
    } finally { btn.disabled = false }
  });

  // ---------- history ----------
  function renderHist() {
    const H = S.data?.days || [];
    if (!H.length) { $('histTable').innerHTML = '<div class="empty">No checks saved yet.</div>'; return }
    const ks = Object.keys(CHECKS());
    $('histTable').innerHTML = `<table><thead><tr><th>Closing</th>${ks.map(k => `<th>${esc(CHECKS()[k])}</th>`).join('')}</tr></thead><tbody>` +
      H.map(d => `<tr><td>${nice(d.date)}</td>` + ks.map(k => {
        const c = d.checks[k];
        if (!c) return '<td><span class="pill bad">Missing</span></td>';
        const lowOut = Object.entries(c.items).filter(([, r]) => ['Out', 'Low'].includes(r.level)).map(([key, r]) => `${esc(key.split('|')[1])} (${r.level.toLowerCase()})`);
        return `<td><span class="pill ok">Done</span> <span class="muted">${esc(c.by)} ${sydTime(c.at)}</span>${lowOut.length ? `<br><span class="muted">${lowOut.join(', ')}</span>` : ''}</td>`;
      }).join('') + '</tr>').join('') + '</tbody></table>';
  }

  setInterval(() => { if (!document.hidden && S.pin && !S.loading && !$('vStart').hidden) load() }, 60000);

  if (S.pin) { show('vStart'); renderCards(); load() } else askPin('');
})();
</script>
</body>
</html>
